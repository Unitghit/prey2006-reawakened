set g_portalGun 1
loadGame input
wait 50
portalGun lab
set com_fpsTrace 1
spawn func_static name rough_wall model models/portal_rough_ground.ase origin "480 0 80" rotation "0 1 0 0 0 -1 -1 0 0" solid "1"
setviewpos 300 0 80 0
portalGun aim 0 0
echo ROUGH_WALL_BEGIN
portalGun blue
set g_presentationTestForward 127
wait 220
set g_presentationTestForward 0
portalGun status
echo ROUGH_WALL_END
loadGame input
wait 50
portalGun lab
spawn func_static name rough_ceiling model models/portal_rough_ground.ase origin "-256 0 200" rotation "1 0 0 0 -1 0 0 0 -1" solid "1"
setviewpos -256 0 100 0
portalGun aim -90 0
echo ROUGH_CEILING_BEGIN
portalGun blue
setviewpos -256 0 180 0
portalGun velocity 0 0 270
wait 220
portalGun status
echo ROUGH_CEILING_END
condump rough_surfaces.log
quit
