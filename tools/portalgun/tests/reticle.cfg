set g_portalGun 1
loadGame input
wait 100
set developer 1
set g_portalGunReticle 1
set g_portalReticleTrace 0
portalGun lab
portalGun select
wait 180
spawn light name reticle_light origin "0 -100 180" light_radius "900 900 900" _color "1 1 1" noshadows 1
echo RETICLE_VALID_BEGIN
setviewpos 0 0 68 180
portalGun look 0 180
wait 150
portalGun reticle
screenshot reticle_valid.tga
echo RETICLE_VALID_END
echo RETICLE_THROUGH_BEGIN
setviewpos 0 0 68 0
portalGun look 0 0
wait 180
portalGun reticle
echo RETICLE_THROUGH_END
// Looking at the existing blue surface: only blue can be replaced here.
echo RETICLE_BLUE_BEGIN
setviewpos 0 0 68 0
portalGun look 0 0
// Unlink so this aims at the backing, not through the pair.
remove rw_gun_orange
wait 150
portalGun reticle
screenshot reticle_blue.tga
echo RETICLE_BLUE_END
// A free-standing moving prop cannot support a portal.
spawn func_moveable name reticle_blocker model models/portal_obstacle.ase origin "-70 0 68" nodrop 1
setviewpos 0 0 68 180
portalGun look 0 180
echo RETICLE_INVALID_BEGIN
wait 120
portalGun reticle
screenshot reticle_invalid.tga
echo RETICLE_INVALID_END
remove reticle_blocker
setviewpos 0 0 68 0
portalGun look 0 0
saveGame reticle
loadGame reticle
wait 100
set developer 1
echo RETICLE_RELOAD_BEGIN
wait 150
portalGun reticle
screenshot reticle_reload.tga
echo RETICLE_RELOAD_END
loadGame input
wait 80
set developer 1
spawn object_portal name reticle_in model models/reawakened/portalgun/blue.ase origin "300 100 73" angle "180" mins "-4 -39 -49" maxs "4 39 49" startActive 1 cameraTarget reticle_out
spawn object_portal name reticle_out model models/reawakened/portalgun/orange.ase origin "-100 300 73" angle "270" mins "-4 -39 -49" maxs "4 39 49" startActive 1 cameraTarget reticle_in
wait 60
setviewpos 0 100 73 0
portalGun look 0 0
echo RETICLE_SCRIPTED_BEGIN
wait 150
portalGun reticle
echo RETICLE_SCRIPTED_END
set g_portalGunReticle 0
wait 30
portalGun reticle
screenshot reticle_standard.tga
condump reticle.log
quit
