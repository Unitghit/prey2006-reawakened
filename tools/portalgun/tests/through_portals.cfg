set g_portalGun 1
loadGame input
wait 60
portalGun lab
set com_fpsTrace 1
setviewpos 0 0 73 0
portalGun look 0 0
wait 2
portalGun aim 0 0
echo THROUGH_PLAYER_BEGIN
portalGun shootblue
wait 180
portalGun status
echo THROUGH_PLAYER_END
portalGun aim 0 0
echo THROUGH_OPPOSITE_BEGIN
portalGun shootorange
wait 180
portalGun status
echo THROUGH_OPPOSITE_END
loadGame input
wait 60
portalGun lab
spawn object_portal name script_in model models/reawakened/portalgun/blue.ase origin "300 100 73" angle "180" mins "-4 -39 -49" maxs "4 39 49" startActive "1" cameraTarget "script_out"
spawn object_portal name script_out model models/reawakened/portalgun/orange.ase origin "-100 300 73" angle "270" mins "-4 -39 -49" maxs "4 39 49" startActive "1" cameraTarget "script_in"
wait 40
setviewpos 0 100 73 0
portalGun look 0 0
wait 2
portalGun aim 0 0
saveGame scripted_pair
echo THROUGH_SCRIPT_BEGIN
portalGun shootblue
wait 14
saveGame through_flight
wait 150
portalGun status
echo THROUGH_SCRIPT_END
echo THROUGH_RELOAD_BEGIN
loadGame through_flight
wait 180
portalGun status
echo THROUGH_RELOAD_END
loadGame scripted_pair
wait 40
spawn object_portal name chain_in model models/reawakened/portalgun/blue.ase origin "-100 100 73" angle "90" mins "-4 -39 -49" maxs "4 39 49" startActive "1" cameraTarget "chain_out"
spawn object_portal name chain_out model models/reawakened/portalgun/orange.ase origin "-300 -100 73" angle "0" mins "-4 -39 -49" maxs "4 39 49" startActive "1" cameraTarget "chain_in"
wait 40
portalGun aim 0 0
echo THROUGH_CHAIN_BEGIN
portalGun shootorange
wait 220
portalGun status
echo THROUGH_CHAIN_END
loadGame input
wait 50
setviewpos 0 45 73 0
portalGun look 0 0
wait 2
portalGun aim 0 0
echo THROUGH_OUTSIDE_BEGIN
portalGun shootblue
wait 180
portalGun status
echo THROUGH_OUTSIDE_END
loadGame input
wait 50
spawn object_portal name loop_in model models/reawakened/portalgun/blue.ase origin "300 100 73" angle "180" mins "-4 -39 -49" maxs "4 39 49" startActive "1" cameraTarget "loop_out"
spawn object_portal name loop_out model models/reawakened/portalgun/orange.ase origin "0 100 73" angle "0" mins "-4 -39 -49" maxs "4 39 49" startActive "1" cameraTarget "loop_in"
wait 40
setviewpos -200 100 73 0
portalGun look 0 0
wait 2
portalGun aim 0 0
echo THROUGH_LOOP_BEGIN
portalGun shootblue
wait 240
portalGun status
echo THROUGH_LOOP_END
condump through_portals.log
quit
