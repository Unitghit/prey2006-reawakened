set g_portalGun 1
dmap maps/rw_portal_cover_mover.map
map rw_portal_cover_mover
wait 100
portalGun lab
set developer 1
set com_fpsTrace 1
setviewpos 0 0 68 0
portalGun aim 0 0
portalGun blue
portalGun aim 0 90
portalGun orange
setviewpos 0 450 68 90
portalGun look 0 90
portalGun velocity 0 0 0
echo TAPER_EXIT_BEGIN
set g_presentationTestForward 127
wait 260
set g_presentationTestForward 0
portalGun status
echo TAPER_EXIT_END
condump cover_mover.log
quit
