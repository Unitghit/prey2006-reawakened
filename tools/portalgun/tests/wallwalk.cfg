// Requires the local portalwalk reproduction save; never distribute the save.
// Run in an isolated, muted profile on the hidden test desktop.
set g_portalGun 1
loadGame portalwalk
set developer 1
set com_fpsTrace 1
portalGun velocity 0 0 220
wait 45
saveGame wallwalk_partial_test
loadGame wallwalk_partial_test
set developer 1
wait 600
portalGun status
condump wallwalk.log
quit
