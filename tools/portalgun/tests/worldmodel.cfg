// Requires an isolated profile containing the gunmodels save and imported assets.
set s_volume_dB -60
set g_portalGun 1
set com_fpsTrace 1
loadGame gunmodels
wait 100
set developer 1
portalGun lab
portalGun select
portalGun look 0 0
wait 150
screenshot world_first.tga
set pm_thirdPerson 1
set pm_thirdPersonRange 100
set pm_thirdPersonClip 0
set pm_thirdPersonAngle 90
set com_fpsTestAttack 1
wait 25
set com_fpsTestAttack 0
wait 100
screenshot world_blue.tga
set com_fpsTestAttack 2
wait 25
set com_fpsTestAttack 0
wait 100
screenshot world_orange.tga
portalGun look -25 0
wait 100
screenshot world_up.tga
portalGun look 25 0
wait 100
screenshot world_down.tga
portalGun look 0 0
weaponPackInfo 2
wait 220
screenshot world_other.tga
portalGun select
wait 220
screenshot world_return.tga
saveGame worldmodel
loadGame worldmodel
wait 120
screenshot world_restore.tga
condump worldmodel.log
quit
