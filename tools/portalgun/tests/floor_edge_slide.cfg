set g_portalGun 1
loadGame input
wait 50
portalGun lab
set com_fpsTrace 1
setviewpos -256 0 68 0
wait 30
portalGun aim 90 0
portalGun blue
spawn func_static name edge_blocker model models/portal_obstacle.ase origin "0 506 73" solid "1"
echo EDGE_BLOCK_BEGIN
wait 100
portalGun status
echo EDGE_BLOCK_END
echo EDGE_SLIDE_BEGIN
portalGun look 0 0
set g_presentationTestForward 127
wait 240
set g_presentationTestForward 0
portalGun status
echo EDGE_SLIDE_END
condump floor_edge_slide.log
quit
