set g_portalGun 1
dmap maps/rw_portal_slab.map
map rw_portal_slab
wait 100
portalGun lab
set developer 1
set com_fpsTrace 1
setviewpos -256 0 68 0
wait 30
portalGun aim 90 0
portalGun blue
setviewpos 0 0 68 90
wait 30
portalGun aim 0 90
portalGun orange
wait 100
echo SLAB_ENTRY_BEGIN
setviewpos -309 0 24 0
portalGun velocity 0 0 0
wait 200
portalGun status
echo SLAB_ENTRY_END
condump floor_slab.log
quit
