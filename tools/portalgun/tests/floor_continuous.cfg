set g_portalGun 1
loadGame input
wait 50
portalGun lab
set com_fpsTrace 1
setviewpos -256 0 68 0
wait 30
portalGun aim 90 0
portalGun blue
set g_gravity 1
wait 20
echo CONTINUOUS_PARTIAL_BEGIN
setviewpos -256 0 58 0
portalGun velocity 0 0 0
wait 60
portalGun status
saveGame partial_camera
loadGame partial_camera
wait 60
portalGun status
echo CONTINUOUS_PARTIAL_END
echo CONTINUOUS_REVERSE_BEGIN
portalGun velocity 0 0 80
wait 180
portalGun status
echo CONTINUOUS_REVERSE_END
