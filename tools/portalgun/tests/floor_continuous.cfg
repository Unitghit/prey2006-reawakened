setviewpos -256 0 30 0
portalGun velocity 0 0 -160
wait 200
portalGun status
echo CONTINUOUS_CROSS_END
echo CONTINUOUS_FAST_BEGIN
setviewpos -256 0 30 0
portalGun velocity 0 0 -2400
wait 100
portalGun status
echo CONTINUOUS_FAST_END
set g_gravity 1066
condump floor_continuous.log
quit
