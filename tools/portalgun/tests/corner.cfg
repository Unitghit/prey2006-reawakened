set g_portalGun 1
dmap maps/rw_portal_corner.map
map rw_portal_corner
wait 100
portalGun lab
set developer 1
set com_fpsTrace 1
setviewpos 0 16 68 0
portalGun aim 0 0
portalGun blue
portalGun aim 0 90
portalGun orange
wait 30
saveGame corner
echo CORNER_CENTER_BEGIN
setviewpos 60 16 68 0
portalGun look 0 0
set g_presentationTestForward 127
wait 200
set g_presentationTestForward 0
portalGun status
echo CORNER_CENTER_END
loadGame corner
wait 50
set developer 1
echo CORNER_EDGE_BEGIN
setviewpos 60 55 68 0
portalGun look 0 0
portalGun probe
set g_presentationTestForward 127
wait 200
set g_presentationTestForward 0
portalGun status
echo CORNER_EDGE_END
setviewpos 192 16 240 0
portalGun aim 90 0
portalGun blue
setviewpos -200 -200 68 0
echo CORNER_PROP_BEGIN
spawn func_moveable name corner_prop model models/portal_obstacle.ase origin "192 16 235"
wait 100
echo CORNER_PROP_END
condump corner.log
quit
