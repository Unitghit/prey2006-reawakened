set g_portalGun 1
loadGame input
wait 50
portalGun lab
set com_fpsTrace 1
spawn func_moveable name release_prop model _default origin "511 0 73"
portalGun aim 0 180
echo OCCUPANT_RELEASE_BEGIN
portalGun blue
portalGun status
echo OCCUPANT_RELEASE_END
loadGame input
wait 50
portalGun lab
spawn func_moveable name blocked_prop model _default origin "511 0 73"
spawn func_static name release_blocker model models/portal_terrain_cap.ase origin "504 0 73" rotation "0 1 0 0 0 1 1 0 0" solid "1"
portalGun aim 0 180
echo OCCUPANT_BLOCKED_BEGIN
portalGun blue
portalGun status
echo OCCUPANT_BLOCKED_END
loadGame input
wait 50
setviewpos 511 0 73 0
portalGun aim 0 180
echo OCCUPANT_PLAYER_BEGIN
portalGun blue
portalGun status
echo OCCUPANT_PLAYER_END
condump replacement_occupants.log
quit
