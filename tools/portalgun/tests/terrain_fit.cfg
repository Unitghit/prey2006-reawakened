set g_portalGun 1
dmap maps/rw_portal_terrain.map
map rw_portal_terrain
wait 100
portalGun lab
set developer 1
set com_fpsTrace 1
setviewpos 0 0 68 90
portalGun aim 0 90
portalGun orange
echo TERRAIN_GENTLE_BEGIN
setviewpos -256 0 140 0
portalGun aim 90 0
portalGun blue
portalGun status
echo TERRAIN_GENTLE_END
saveGame terrain_pair
echo TERRAIN_CROSS_BEGIN
portalGun velocity 0 0 -160
wait 240
portalGun status
echo TERRAIN_CROSS_END
echo TERRAIN_RELOAD_BEGIN
loadGame terrain_pair
portalGun velocity 0 0 -160
wait 240
portalGun status
echo TERRAIN_RELOAD_END
loadGame terrain_pair
wait 60
echo TERRAIN_RIDGE_BEGIN
setviewpos 0 -256 160 0
portalGun aim 90 0
portalGun blue
portalGun status
echo TERRAIN_RIDGE_END
echo TERRAIN_LEDGE_BEGIN
setviewpos 256 0 180 0
portalGun aim 90 0
portalGun blue
portalGun status
echo TERRAIN_LEDGE_END
loadGame terrain_pair
wait 60
echo TERRAIN_SLOPE_BEGIN
setviewpos 0 256 180 0
portalGun aim 90 0
portalGun blue
portalGun velocity 0 0 -160
wait 240
portalGun status
echo TERRAIN_SLOPE_END
loadGame terrain_pair
wait 60
setviewpos -256 0 50 0
spawn func_static name terrain_headroom model models/portal_terrain_cap.ase origin "-256 0 60" solid "1"
echo TERRAIN_HEADROOM_BEGIN
portalGun aim 90 0
portalGun blue
portalGun status
echo TERRAIN_HEADROOM_END
condump terrain_fit.log
quit
