// Isolated muted profile with local nofog and multiportal2 saves.
set g_portalGun 1
set r_skipFogLights 0
set r_skipParticles 0
set com_fpsTrace 1
loadGame nofog
wait 150
set developer 1
screenshot finalfog.tga
saveGame fog_regression
portalGun look 0 180
wait 50
portalGun look 0 215
wait 50
loadGame fog_regression
wait 100
screenshot fogreload.tga
loadGame multiportal2
wait 200
screenshot nestedfog.tga
condump fogregression.log
quit
