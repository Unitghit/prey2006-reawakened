set g_portalGun 1
dmap maps/rw_portal_surface.map
map rw_portal_surface
wait 100
portalGun lab
set com_fpsTrace 1
echo SURFACE_RECESS_BEGIN
setviewpos 0 0 160 0
portalGun aim 0 0
portalGun blue
portalGun status
echo SURFACE_RECESS_END
echo SURFACE_OBSTACLE_BEGIN
spawn func_static name window_obstacle model models/portal_obstacle.ase origin "499 43 160" solid "1"
portalGun aim 0 0
portalGun blue
portalGun status
echo SURFACE_OBSTACLE_END
echo SURFACE_BLOCKED_BEGIN
spawn func_static name opening_left model models/portal_terrain_cap.ase origin "499 -100 160" rotation "0 1 0 0 0 1 1 0 0" solid "1"
spawn func_static name opening_right model models/portal_terrain_cap.ase origin "499 100 160" rotation "0 1 0 0 0 1 1 0 0" solid "1"
portalGun aim 0 0
portalGun blue
portalGun status
echo SURFACE_BLOCKED_END
echo SURFACE_LOW_BEGIN
setviewpos 0 -200 68 0
wait 20
portalGun aim 0 0
portalGun orange
portalGun status
echo SURFACE_LOW_END
condump surface_fit.log
quit
