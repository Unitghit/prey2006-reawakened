// Requires the local catwalkflicker save. Run hidden, muted and isolated.
// The near catwalk inside the portal must keep its glow at every angle.
loadGame catwalkflicker
set developer 1
set com_fpsTrace 0
set com_fpsTestTurn 0
set r_glowStrength 1
set r_glowPortals 1
wait 300
portalGun look 10 177.0
wait 8
