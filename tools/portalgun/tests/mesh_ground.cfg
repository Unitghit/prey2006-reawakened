set g_portalGun 1
loadGame input
wait 50
portalGun lab
set com_fpsTrace 1
spawn func_static name rough_ground model models/portal_rough_ground.ase origin "-256 0 30" rotation "0.98480775 0 -0.17364818 0 1 0 0.17364818 0 0.98480775" solid "1"
echo MESH_PLACE_BEGIN
setviewpos -256 0 140 0
portalGun aim 90 0
portalGun shootblue
wait 60
portalGun status
echo MESH_PLACE_END
setviewpos -256 0 140 0
saveGame mesh_pair
echo MESH_CROSS_BEGIN
portalGun velocity 0 0 -160
wait 240
portalGun status
echo MESH_CROSS_END
echo MESH_RELOAD_BEGIN
loadGame mesh_pair
portalGun velocity 0 0 -160
wait 240
portalGun status
echo MESH_RELOAD_END
loadGame input
wait 30
spawn func_moveable name movable_ground model models/portal_rough_ground.ase origin "-256 0 0"
setviewpos -256 0 140 0
portalGun aim 90 0
echo MESH_MOVABLE_BEGIN
portalGun blue
portalGun status
echo MESH_MOVABLE_END
condump mesh_ground.log
quit
