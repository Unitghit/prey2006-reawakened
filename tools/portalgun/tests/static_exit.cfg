set g_portalGun 1
loadGame input
wait 60
portalGun lab
set com_fpsTrace 1
setviewpos -256 0 68 0
wait 30
portalGun aim 90 0
portalGun blue
spawn func_static name exit_decoration model models/portal_obstacle.ase origin "0 540 73" solid "1"
echo STATIC_BEHIND_BEGIN
setviewpos -256 0 49 0
wait 100
portalGun status
echo STATIC_BEHIND_END
loadGame input
wait 60
portalGun lab
setviewpos -256 0 68 0
wait 30
portalGun aim 90 0
portalGun blue
spawn func_static name exit_obstruction model models/portal_obstacle.ase origin "0 506 73" solid "1"
echo STATIC_FRONT_BEGIN
setviewpos -256 0 49 0
wait 100
portalGun status
echo STATIC_FRONT_END
condump static_exit.log
quit
