set g_portalGun 1
loadGame input
wait 200
portalGun lab
spawn light name shot_test_light origin "160 -80 150" light_radius "900 900 900" _color "1 1 1" noshadows "1"
setviewpos -400 180 68 0
wait 30
echo SHOT_FLIGHT_SAVE_BEGIN
portalGun shootblue
portalGun status
saveGame shot_flight
loadGame shot_flight
wait 3
portalGun lab
screenshot shot_flight.tga
wait 120
screenshot shot_opening.tga
saveGame shot_opening
loadGame shot_opening
wait 600
portalGun lab
portalGun status
screenshot shot_opened.tga
echo SHOT_FLIGHT_SAVE_END
// A replacement in flight must keep its original world aim after looking away.
echo SHOT_LOOK_BEGIN
setviewpos 0 -400 68 90
wait 30
portalGun shootorange
portalGun look 0 0
wait 100
portalGun status
echo SHOT_LOOK_END
// Repeated same-color shots cancel the older pending placement.
echo SHOT_SUPERSEDE_BEGIN
portalGun aim 0 180
portalGun shootblue
portalGun aim 0 -90
portalGun shootblue
wait 220
portalGun status
echo SHOT_SUPERSEDE_END
// A small dynamic obstruction is a rejected impact, never a new portal.
echo SHOT_REJECT_BEGIN
setviewpos 0 0 68 0
wait 30
spawn func_static name shot_obstruction model _default origin "180 0 0" size "32 32 160" solid "1"
wait 30
portalGun aim 0 0
portalGun shootblue
wait 100
portalGun status
screenshot shot_rejected.tga
echo SHOT_REJECT_END
echo SHOT_BLOCKED_BEGIN
setviewpos 0 0 68 180
wait 30
portalGun shootblue
spawn func_static name shot_late_obstruction model _default origin "-180 0 0" size "32 32 160" solid "1"
wait 100
portalGun status
echo SHOT_BLOCKED_END
// Disabling the feature cancels flights and leaves no later placement.
echo SHOT_DISABLE_BEGIN
portalGun aim 0 180
portalGun shootorange
set g_portalGun 0
wait 100
portalGun status
echo SHOT_DISABLE_END
set g_portalGun 1
wait 20
condump shots.log
quit
