set g_portalGun 1
dmap maps/rw_portal_column.map
map rw_portal_column
wait 100
portalGun lab
set developer 1
set com_fpsTrace 1
setviewpos -256 0 100 0
portalGun aim -90 0
portalGun blue
setviewpos 0 0 68 0
portalGun aim 0 0
portalGun orange
setviewpos 450 0 68 0
portalGun look 0 0
portalGun velocity 0 0 0
echo SLOPE_EXIT_BEGIN
set g_presentationTestForward 127
wait 300
set g_presentationTestForward 0
portalGun status
echo SLOPE_EXIT_END
condump clip_column.log
quit
