set g_portalGun 1
loadGame input
wait 60
set developer 1
set com_fpsTrace 1
setviewpos 0 -200 73 0
portalGun aim 0 0
portalGun blue
setviewpos 0 -118 73 0
portalGun aim 0 0
echo CLOSE_ADJACENT_BEGIN
portalGun orange
portalGun status
echo CLOSE_ADJACENT_END
setviewpos 0 -200 73 0
portalGun aim 0 0
echo CLOSE_OVERLAP_BEGIN
portalGun orange
portalGun status
echo CLOSE_OVERLAP_END
setviewpos 400 -118 73 0
wait 30
echo CLOSE_CROSS_BEGIN
set g_presentationTestForward 127
wait 200
set g_presentationTestForward 0
portalGun status
echo CLOSE_CROSS_END
condump close.log
quit
