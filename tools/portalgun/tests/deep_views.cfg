set g_portalGun 1
set r_portalDeepViews 2
set r_portalMaxDepth 6
set r_portalDistanceScale 16
loadGame input
wait 80
portalGun lab
spawn object_portal name repeat_in model models/reawakened/portalgun/blue.ase origin "300 100 73" angle "180" mins "-4 -39 -49" maxs "4 39 49" startActive "1" cameraTarget "repeat_out"
spawn object_portal name repeat_out model models/reawakened/portalgun/orange.ase origin "-300 100 73" angle "0" mins "-4 -39 -49" maxs "4 39 49" startActive "1" cameraTarget "repeat_in"
wait 30
setviewpos 0 100 73 0
portalGun look 0 0
wait 50
set r_portalTrace 1
screenshot deep_first.tga
wait 1
screenshot deep_warm.tga
wait 1
screenshot deep_repeat.tga
condump deep_views.log
clear
set r_portalDeepViews 1
screenshot deep_no_repeat.tga
condump deep_no_repeat.log
clear
set r_portalDeepViews 0
set r_portalMaxDepth 3
screenshot deep_standard.tga
condump deep_standard.log
quit
