// Isolated muted profile with a local gunmodels save and imported RoE assets.
set g_doom3Shotgun 1
set com_fpsTrace 1
set d3_supershotgunTrace 1
loadGame gunmodels
wait 120
set developer 1
give all
portalGun look 0 0
weaponPackInfo 15
wait 500
superShotgunInfo
set com_fpsTestAttack 2
wait 20
set com_fpsTestAttack 0
wait 500
superShotgunInfo
saveGame oneshell
loadGame oneshell
wait 150
superShotgunInfo
weaponAmmoInfo reload
wait 500
superShotgunInfo
set com_fpsTestAttack 1
wait 20
set com_fpsTestAttack 0
wait 500
superShotgunInfo
condump single.log
quit
