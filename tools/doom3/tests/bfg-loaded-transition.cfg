// Run in an isolated hidden muted test profile. Requires referenced local saves.
set g_doom3Shotgun 1
loadGame endingboss2
set developer 1
set ai_disable 1
wait 150
bfgInfo
plasmaInfo
condump legacy.log
loadGame loadedbfg
set developer 1
wait 150
bfgInfo
spawn target_endLevel name bfg_exit nextMap rw_portal_lab
wait 20
trigger bfg_exit
wait 300
set developer 1
weaponPackInfo 16
wait 250
bfgInfo
saveGame nextbfg
loadGame nextbfg
wait 200
set developer 1
bfgInfo
