// Isolated muted profile; copy AutoSave__Poor_Bastards into its savegames directory.
// Launch with EAX enabled. Never run against the player profile.
set s_volume_dB -60
set g_noSpiritResurrections 1
set com_maxFPS 120
s_testThreadFormatting
loadgame AutoSave__Poor_Bastards
wait 120
s_retailAudioTest
kill
wait 720
loadgame AutoSave__Poor_Bastards
wait 120
savegame crash_b_roundtrip
wait 30
loadgame crash_b_roundtrip
wait 120
s_retailAudioTest
kill
wait 720
loadgame crash_b_roundtrip
wait 120
s_testThreadFormatting
s_retailAudioTest
echo FEEDINGTOWERB_CRASH_REGRESSION_COMPLETE
condump crash_b.log
quit
