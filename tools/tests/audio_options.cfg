// Run only in an isolated muted profile. Device/EAX changes apply immediately.
set s_device default
set s_useEAXReverb 0
set g_levelloadmusic 1
set s_volume_dB -60
startMenu
wait 1500
menuPad down
wait 100
menuPad down
wait 100
menuPad down
wait 100
menuPad down
wait 100
menuPad a
wait 600
menuPad rb
wait 150
menuPad rb
wait 150
menuPad rb
wait 150
menuPad click 425 134
s_volume_dB
menuPad click 470 164
s_musicvolume_dB
menuPad click 470 195
g_levelloadmusic
menuPad click 470 355
wait 100
s_device
screenshot device_notice.tga
screenshot selected_device.tga
menuPad click 470 385
wait 100
s_useEAXReverb
screenshot options_changed.tga
writeConfig audio_options_saved.cfg
echo AUDIO_OPTIONS_CHANGED
condump options.log
quit
