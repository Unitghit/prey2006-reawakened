// Run only in an isolated, muted profile on a private desktop. Requires ammobug.
// Exercises real menu input: 4K, borderless, windowed, renderer restart.
set s_volume_dB -60
set r_mode 28
startMenu
wait 800
menuPad down
menuPad down
menuPad down
menuPad down
menuPad a
wait 300
menuPad rb
menuPad rb
wait 100
menuPad click 470 255
wait 10
r_mode
screenshot video_4k_selected.tga
menuPad click 440 410
wait 300
r_mode
r_fullscreen
screenshot video_4k_applied.tga
menuPad click 470 285
menuPad click 470 285
wait 10
screenshot video_borderless_selected.tga
menuPad click 440 410
wait 300
r_fullscreen
r_fullscreenDesktop
screenshot video_borderless_applied.tga
menuPad click 470 285
menuPad click 440 410
wait 300
r_fullscreen
r_fullscreenDesktop
set r_mode 9
vid_restart
wait 100
loadgame ammobug
wait 200
echo VIDEO_APPLY_COMPLETE
condump video_apply.log
quit
