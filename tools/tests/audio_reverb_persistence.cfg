// Same isolated profile after audio_reverb_groups.cfg. Requires local hud_audit and seam saves.
// Expect voice=2, weapon=3, environment=7 before and after both loads; RETAIL_AUDIO_TEST PASS.
wait 120
set s_volume_dB -60
s_eaxVoiceReverb
s_eaxWeaponReverb
s_eaxEnvironmentReverb
loadgame hud_audit
wait 100
s_retailAudioTest
loadgame seam
wait 100
s_retailAudioTest
s_eaxVoiceReverb
s_eaxWeaponReverb
s_eaxEnvironmentReverb
s_volume_dB
s_musicVolume_dB
echo REVERB_GROUP_PERSIST_COMPLETE
condump reverb_groups_persist.log
quit
