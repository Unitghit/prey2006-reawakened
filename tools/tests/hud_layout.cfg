// Isolated muted profile only; requires a copy of ammobug. Run at 4:3, 16:9 and ultrawide resolutions.
set s_volume_dB -60
set developer 1
loadgame ammobug
wait 180
set g_stopTime 0
set gui_hudWidescreen 0
wait 10
screenshot hud_classic.tga
set gui_hudWidescreen 1
wait 10
screenshot hud_wide.tga
savegame hud_layout_test
wait 10
loadgame hud_layout_test
wait 180
screenshot hud_reloaded.tga
echo HUD_LAYOUT_COMPLETE
condump hud_layout.log
quit
