// Isolated muted profile, 1280x720 window, EAX enabled, local seam save.
// Test backend routing, menu sliders and EAX off/on. Then run audio_reverb_persistence.cfg in a fresh process.
set s_volume_dB -60
set s_eaxVoiceReverb 5
set s_eaxWeaponReverb 5
set s_eaxEnvironmentReverb 5
loadgame seam
wait 150
s_retailAudioTest
startMenu
wait 800
menuPad click 140 323
wait 300
menuPad rb
menuPad rb
menuPad rb
wait 100
screenshot reverb_groups_center.tga
menuPad drag 433 365 475 365
s_eaxWeaponReverb
s_eaxEnvironmentReverb
menuPad drag 433 390 395 390
s_eaxEnvironmentReverb
s_eaxVoiceReverb
screenshot reverb_groups_extremes.tga
menuPad click 470 315
wait 100
screenshot reverb_groups_off.tga
s_retailAudioTest
menuPad click 470 315
wait 100
s_retailAudioTest
menuPad click 414 340
menuPad click 421 365
menuPad click 446 390
s_eaxVoiceReverb
s_eaxWeaponReverb
s_eaxEnvironmentReverb
wait 120
writeConfig reverb_groups_saved.cfg
condump reverb_groups.log
quit
