// Isolated profile only: requires a copy of ammobug; mutates test inventory and writes retail_ammo_audit save.
set s_volume_dB -60
set developer 1
set g_doom3Shotgun 0
loadgame ammobug
wait 180
set g_doom3Shotgun 0
wait 20
weaponAmmoInfo norecharge
weaponAmmoInfo seed 0 0 0
weaponAmmoInfo pickup 30
weaponAmmoInfo
chaingunInfo seed 0 0
chaingunInfo pickup 100
chaingunInfo
plasmaInfo seed 0 0
plasmaInfo pickup 10
plasmaInfo
rocketInfo seed 0 0
rocketInfo pickup 5
rocketInfo
weaponAmmoInfo pickup 999
chaingunInfo pickup 999
plasmaInfo pickup 999
rocketInfo pickup 999
wait 20
weaponAmmoInfo
chaingunInfo
plasmaInfo
rocketInfo
savegame retail_ammo_audit
wait 20
loadgame retail_ammo_audit
wait 180
weaponAmmoInfo
chaingunInfo
plasmaInfo
rocketInfo
echo RETAIL_AMMO_AUDIT_COMPLETE
condump retail_ammo_audit.log
quit
