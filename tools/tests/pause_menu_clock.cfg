// Isolated muted profile; requires local seam save. Compare stars and sphere glow
// between each screenshot pair, then verify resume and reload succeed.
wait 120
set s_volume_dB -60
startMenu
wait 300
screenshot clock_home_a.tga
wait 240
screenshot clock_home_b.tga
loadgame seam
wait 100
startMenu
wait 300
screenshot clock_pause_a.tga
wait 240
screenshot clock_pause_b.tga
exitMenu
wait 100
screenshot clock_resumed.tga
loadgame seam
wait 100
s_retailAudioTest
condump pause_clock.log
quit
