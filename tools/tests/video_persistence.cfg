// Isolated second-session test, after saving a 4K profile. Requires ammobug.
// Check r_mode stays 20 across quality presets and invalid custom size falls back to 9.
set s_volume_dB -60
r_mode
r_fullscreen
r_fullscreenDesktop
r_multiSamples
loadgame ammobug
wait 200
startMenu
wait 800
menuPad click 140 323
wait 300
menuPad rb
menuPad rb
wait 100
menuPad click 280 210
wait 10
r_mode
com_imageQuality
menuPad click 440 210
wait 10
r_mode
com_imageQuality
menuPad click 440 410
wait 200
screenshot video_persist.tga
set r_mode -1
set r_customWidth -20
vid_restart
wait 100
r_mode
r_fullscreen
echo VIDEO_PERSIST_AND_FALLBACK_COMPLETE
condump video_persist.log
quit
