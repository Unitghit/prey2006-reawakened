// Standard Prey keyboard/mouse bindings, matching retail default.cfg.
// Saved custom bindings in prey06.cfg override these at startup.
unbindall
bind    ALT			_strafe
bind	SPACE		_moveup
bind	c			_movedown
bind	shift		_movedown
bind    w			_forward
bind    s			_back
bind    a			_moveleft
bind    d			_moveright
bind    UPARROW		_forward
bind    DOWNARROW	_back
bind    LEFTARROW	_left
bind    RIGHTARROW	_right
bind	0			_impulse0
bind	1			_impulse1
bind	2			_impulse2
bind	3			_impulse3
bind	4			_impulse4
bind	5			_impulse5
bind	6			_impulse6
bind	7			_impulse7
bind	8			_impulse8
bind	9			_impulse9
bind    MOUSE1      _attack
bind	MOUSE2		_attackalt
bind    MOUSE3      _impulse54
bind    e      	    _impulse54
bind	f			_impulse16
bind	MWHEELUP	_impulse15
bind	MWHEELDOWN	_impulse14
bind	g			_impulse25
bind    DEL         _lookdown
bind    PGDN        _lookup
bind    END         _impulse18
bind    \           _mlook
bind	F1			"togglehelp"
bind	PRINTSCREEN	"screenshot"
bind	F5			"savegame quick"
bind	F9			"loadgame quick"
bind	TAB			_impulse19
bind	F2			_impulse28
bind	F3			_impulse29
bind	F4			_impulse17
bind	F6			_impulse20
bind	F7			_impulse22
bind	t			clientMessageMode
bind 	y			"clientMessageMode 1"
